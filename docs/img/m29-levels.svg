<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="860" height="580" fill="#ffffff"/>
  <text x="20" y="28" font-size="14" text-anchor="start" fill="#2b3a4f" font-weight="bold">One model on three levels; every existing form is a projection at one level</text>
  <rect x="20" y="60" width="150" height="370" rx="6" fill="#fff8e8" stroke="#c9a54a"/>
  <text x="95.0" y="211.5" font-size="13" text-anchor="middle" fill="#2b3a4f" font-weight="bold">Header</text>
  <text x="95.0" y="226.5" font-size="12" text-anchor="middle" fill="#555">dimensions, types</text>
  <text x="95.0" y="241.5" font-size="12" text-anchor="middle" fill="#555">CRS and grid</text>
  <text x="95.0" y="256.5" font-size="12" text-anchor="middle" fill="#555">fill, packing, units</text>
  <text x="95.0" y="271.5" font-size="12" text-anchor="middle" fill="#555">the m17 description</text>
  <text x="95.0" y="286.5" font-size="12" text-anchor="middle" fill="#555">assertions live here</text>
  <rect x="200" y="60" width="300" height="100" rx="6" fill="#eef4fa" stroke="#7a9cbf"/>
  <text x="350.0" y="99.0" font-size="13" text-anchor="middle" fill="#2b3a4f" font-weight="bold">Steps</text>
  <text x="350.0" y="114.0" font-size="12" text-anchor="middle" fill="#555">whole-array operations</text>
  <text x="350.0" y="129.0" font-size="12" text-anchor="middle" fill="#555">rows: step, inputs, parameters</text>
  <rect x="560" y="68" width="280" height="84" rx="6" fill="#f7f7f7" stroke="#bbbbbb"/>
  <text x="700.0" y="99.0" font-size="12" text-anchor="middle" fill="#555">DerivedArray, pixel functions</text>
  <text x="700.0" y="114.0" font-size="12" text-anchor="middle" fill="#555">Warped VRT, GDALG pipeline</text>
  <text x="700.0" y="129.0" font-size="12" text-anchor="middle" fill="#555">ArrIR chain (m22)</text>
  <line x1="500" y1="110" x2="556" y2="110" stroke="#999" stroke-dasharray="3 3"/>
  <rect x="200" y="195" width="300" height="100" rx="6" fill="#eef4fa" stroke="#7a9cbf"/>
  <text x="350.0" y="234.0" font-size="13" text-anchor="middle" fill="#2b3a4f" font-weight="bold">Placements</text>
  <text x="350.0" y="249.0" font-size="12" text-anchor="middle" fill="#555">windows of named sources</text>
  <text x="350.0" y="264.0" font-size="12" text-anchor="middle" fill="#555">rows: source name, source window, dest window, ops</text>
  <rect x="560" y="203" width="280" height="84" rx="6" fill="#f7f7f7" stroke="#bbbbbb"/>
  <text x="700.0" y="234.0" font-size="12" text-anchor="middle" fill="#555">VRT sources, vrt://</text>
  <text x="700.0" y="249.0" font-size="12" text-anchor="middle" fill="#555">GTI rows</text>
  <text x="700.0" y="264.0" font-size="12" text-anchor="middle" fill="#555">mdim-refs placements</text>
  <line x1="500" y1="245" x2="556" y2="245" stroke="#999" stroke-dasharray="3 3"/>
  <rect x="200" y="330" width="300" height="100" rx="6" fill="#eef4fa" stroke="#7a9cbf"/>
  <text x="350.0" y="369.0" font-size="13" text-anchor="middle" fill="#2b3a4f" font-weight="bold">Refs</text>
  <text x="350.0" y="384.0" font-size="12" text-anchor="middle" fill="#555">byte ranges by chunk key</text>
  <text x="350.0" y="399.0" font-size="12" text-anchor="middle" fill="#555">rows: key, uri, offset, size, codecs, etag</text>
  <rect x="560" y="338" width="280" height="84" rx="6" fill="#f7f7f7" stroke="#bbbbbb"/>
  <text x="700.0" y="369.0" font-size="12" text-anchor="middle" fill="#555">mdim-refs chunk tables</text>
  <text x="700.0" y="384.0" font-size="12" text-anchor="middle" fill="#555">kerchunk</text>
  <text x="700.0" y="399.0" font-size="12" text-anchor="middle" fill="#555">Icechunk manifests</text>
  <line x1="500" y1="380" x2="556" y2="380" stroke="#999" stroke-dasharray="3 3"/>
  <text x="700" y="54" font-size="12" text-anchor="middle" fill="#555">written forms and stores</text>
  <line x1="300" y1="160" x2="300" y2="195" stroke="#444" marker-end="url(#a)"/>
  <line x1="400" y1="195" x2="400" y2="160" stroke="#444" marker-end="url(#a)"/>
  <text x="294" y="182" font-size="11" text-anchor="end" fill="#444">lower: only re-indexing steps</text>
  <text x="408" y="182" font-size="11" text-anchor="start" fill="#444">raise</text>
  <line x1="300" y1="295" x2="300" y2="330" stroke="#444" marker-end="url(#a)"/>
  <line x1="400" y1="330" x2="400" y2="295" stroke="#444" marker-end="url(#a)"/>
  <text x="294" y="317" font-size="11" text-anchor="end" fill="#444">lower: tiers T0 and T1 only</text>
  <text x="408" y="317" font-size="11" text-anchor="start" fill="#444">raise: group refs by source</text>
  <rect x="200" y="470" width="640" height="50" rx="6" fill="#f0f0f0" stroke="#999999"/>
  <text x="520.0" y="499.0" font-size="12" text-anchor="middle" fill="#555">bytes in place: COG tiles, netCDF/HDF5 chunks, Zarr chunks, GRIB messages</text>
  <line x1="350" y1="430" x2="350" y2="468" stroke="#444" marker-end="url(#a)"/>
  <text x="358" y="453" font-size="11" text-anchor="start" fill="#444">fetch, decode</text>
  <text x="20" y="555" font-size="12" text-anchor="start" fill="#555">Every level is a table with the header beside it, so each is Arrow-native and planning at any level is a filter and a join.</text>
</svg>
