<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- column headers -->
  <text x="250" y="28" text-anchor="middle" font-weight="bold" fill="#2b3a4f">ArrIR (proposed crates)</text>
  <text x="560" y="28" text-anchor="middle" font-weight="bold" fill="#2b3a4f">wxylib (today)</text>

  <!-- logical plan band -->
  <rect x="20" y="42" width="720" height="86" rx="8" fill="#fdf3e6" stroke="#c9a46b"/>
  <text x="32" y="62" font-weight="bold" fill="#7a5a22">Logical plan</text>
  <text x="32" y="78" font-size="11" fill="#7a5a22">what to compute</text>
  <rect x="150" y="56" width="200" height="58" rx="6" fill="#fff" stroke="#c9a46b"/>
  <text x="250" y="76" text-anchor="middle">arrir, arrir-logical</text>
  <text x="250" y="92" text-anchor="middle" font-size="11" fill="#555">Open -&gt; Select -&gt; Warp -&gt; Cast</text>
  <text x="250" y="106" text-anchor="middle" font-size="11" fill="#555">effects, rewrites, adapters</text>
  <rect x="440" y="56" width="240" height="58" rx="6" fill="#fff" stroke="#c9a46b" stroke-dasharray="5,4"/>
  <text x="560" y="76" text-anchor="middle" fill="#7a5a22">missing: each verb plans alone</text>
  <text x="560" y="92" text-anchor="middle" font-size="11" fill="#555">small step: --dry-run prints the chain</text>
  <text x="560" y="106" text-anchor="middle" font-size="11" fill="#555">m09 options as operation structs</text>

  <!-- types band -->
  <rect x="20" y="140" width="720" height="70" rx="8" fill="#eef2f7" stroke="#9aa9bd"/>
  <text x="32" y="160" font-weight="bold" fill="#2b3a4f">Schema, grids</text>
  <rect x="150" y="150" width="200" height="50" rx="6" fill="#fff" stroke="#6b7c93"/>
  <text x="250" y="170" text-anchor="middle">arrir-types</text>
  <text x="250" y="186" text-anchor="middle" font-size="11" fill="#555">Grid names coordinates; staggering</text>
  <rect x="440" y="150" width="240" height="50" rx="6" fill="#fff" stroke="#6b7c93"/>
  <text x="560" y="170" text-anchor="middle">wxy-domain</text>
  <text x="560" y="186" text-anchor="middle" font-size="11" fill="#555">rungs R0-R6; evaluates positions</text>
  <line x1="352" y1="175" x2="438" y2="175" stroke="#444" stroke-dasharray="3,3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="395" y="168" text-anchor="middle" font-size="10" fill="#555">compare</text>

  <!-- layout band -->
  <rect x="20" y="222" width="720" height="70" rx="8" fill="#eef6ee" stroke="#8fb58f"/>
  <text x="32" y="242" font-weight="bold" fill="#2f5a2f">Storage layout</text>
  <text x="32" y="258" font-size="11" fill="#2f5a2f">byterefs = mdim-refs/0.2</text>
  <rect x="150" y="232" width="200" height="50" rx="6" fill="#fff" stroke="#6f9a6f"/>
  <text x="250" y="252" text-anchor="middle">arrir-layout</text>
  <text x="250" y="268" text-anchor="middle" font-size="11" fill="#555">binding and validator</text>
  <rect x="440" y="232" width="240" height="50" rx="6" fill="#fff" stroke="#6f9a6f"/>
  <text x="560" y="252" text-anchor="middle">wxy-refs, wxy-cache</text>
  <text x="560" y="268" text-anchor="middle" font-size="11" fill="#555">reads live stores (BRAN, GHRSST, CMEMS)</text>
  <line x1="352" y1="257" x2="438" y2="257" stroke="#444" stroke-dasharray="3,3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="395" y="250" text-anchor="middle" font-size="10" fill="#555">one crate?</text>

  <!-- physical band -->
  <rect x="20" y="304" width="720" height="100" rx="8" fill="#f3eef7" stroke="#a99abd"/>
  <text x="32" y="324" font-weight="bold" fill="#4a3b5f">Physical plan</text>
  <text x="32" y="340" font-size="11" fill="#4a3b5f">chunks, bytes, weights</text>
  <rect x="150" y="314" width="200" height="50" rx="6" fill="#fff" stroke="#8a7ba3" stroke-dasharray="5,4"/>
  <text x="250" y="334" text-anchor="middle">arrir-physical</text>
  <text x="250" y="350" text-anchor="middle" font-size="11" fill="#555">later: demands, request lists</text>
  <rect x="440" y="314" width="240" height="50" rx="6" fill="#fff" stroke="#8a7ba3"/>
  <text x="560" y="334" text-anchor="middle">Explain (--dry-run), wxy-warp plans</text>
  <text x="560" y="350" text-anchor="middle" font-size="11" fill="#555">keys in fetch order, bytes, cache hits</text>
  <rect x="440" y="370" width="240" height="26" rx="6" fill="#fff" stroke="#8a7ba3"/>
  <text x="560" y="388" text-anchor="middle" font-size="11">rwarp, controlledburn, bigcurve (executor)</text>
  <line x1="352" y1="339" x2="438" y2="339" stroke="#444" stroke-dasharray="3,3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="395" y="332" text-anchor="middle" font-size="10" fill="#555">seed?</text>
</svg>
