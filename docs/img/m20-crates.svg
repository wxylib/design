<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>

  <!-- wxylib band -->
  <rect x="20" y="16" width="720" height="92" rx="8" fill="#eef2f7" stroke="#9aa9bd"/>
  <text x="34" y="38" font-weight="bold" fill="#2b3a4f">wxylib: bytes, tables, plans, CLI, bindings, browser</text>
  <rect x="40" y="52" width="170" height="40" rx="6" fill="#fff" stroke="#6b7c93"/>
  <text x="125" y="70" text-anchor="middle">wxy-warp</text>
  <text x="125" y="85" text-anchor="middle" font-size="11" fill="#555">glue: chunks, zonal, cover</text>
  <rect x="240" y="52" width="150" height="40" rx="6" fill="#fff" stroke="#6b7c93"/>
  <text x="315" y="70" text-anchor="middle">wxy-refs, wxy-zarr</text>
  <text x="315" y="85" text-anchor="middle" font-size="11" fill="#555">reads the bytes</text>
  <rect x="420" y="52" width="140" height="40" rx="6" fill="#fff" stroke="#6b7c93"/>
  <text x="490" y="70" text-anchor="middle">wxylib/web</text>
  <text x="490" y="85" text-anchor="middle" font-size="11" fill="#555">warp demo, edit canvas</text>
  <rect x="590" y="52" width="130" height="40" rx="6" fill="#fff" stroke="#6b7c93"/>
  <text x="655" y="70" text-anchor="middle">py, r</text>
  <text x="655" y="85" text-anchor="middle" font-size="11" fill="#555">bindings</text>

  <!-- movement layer -->
  <rect x="20" y="136" width="720" height="270" rx="8" fill="#f7f5ee" stroke="#bdb59a"/>
  <text x="34" y="158" font-weight="bold" fill="#4f472b">The movement layer (hypertidy): no I/O, no formats, all build for wasm</text>

  <rect x="250" y="176" width="260" height="62" rx="6" fill="#fff" stroke="#8a7f5a" stroke-width="1.5"/>
  <text x="380" y="198" text-anchor="middle" font-weight="bold">rwarp: grid to grid</text>
  <text x="380" y="215" text-anchor="middle" font-size="11" fill="#555">transformers, plans, kernels,</text>
  <text x="380" y="229" text-anchor="middle" font-size="11" fill="#555">area methods, exact footprint</text>

  <rect x="40" y="298" width="200" height="62" rx="6" fill="#fff" stroke="#8a7f5a" stroke-width="1.5"/>
  <text x="140" y="320" text-anchor="middle" font-weight="bold">controlledburn</text>
  <text x="140" y="337" text-anchor="middle" font-size="11" fill="#555">shape to cells: burn, window,</text>
  <text x="140" y="351" text-anchor="middle" font-size="11" fill="#555">row prefix, lines, points</text>

  <rect x="280" y="298" width="200" height="62" rx="6" fill="#fff" stroke="#8a7f5a" stroke-width="1.5"/>
  <text x="380" y="320" text-anchor="middle" font-weight="bold">bigcurve</text>
  <text x="380" y="337" text-anchor="middle" font-size="11" fill="#555">shape to shape: adaptive</text>
  <text x="380" y="351" text-anchor="middle" font-size="11" fill="#555">densify under any forward map</text>

  <rect x="520" y="298" width="200" height="62" rx="6" fill="#fff" stroke="#8a7f5a" stroke-width="1.5"/>
  <text x="620" y="320" text-anchor="middle" font-weight="bold">vaster</text>
  <text x="620" y="337" text-anchor="middle" font-size="11" fill="#555">grid arithmetic: extent,</text>
  <text x="620" y="351" text-anchor="middle" font-size="11" fill="#555">dimension, cell index</text>

  <text x="380" y="392" text-anchor="middle" font-size="12" fill="#4f472b">common currency: index space, fractional (column, row); seam: a batched forward map</text>

  <!-- arrows: solid = depends today, dashed = proposed -->
  <line x1="125" y1="92" x2="300" y2="176" stroke="#444" marker-end="url(#a)"/>
  <line x1="110" y1="92" x2="130" y2="298" stroke="#444" marker-end="url(#a)"/>
  <line x1="490" y1="92" x2="430" y2="176" stroke="#444" marker-end="url(#a)"/>
  <line x1="510" y1="92" x2="420" y2="298" stroke="#444" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <line x1="320" y1="238" x2="180" y2="298" stroke="#444" marker-end="url(#a)"/>
  <line x1="380" y1="238" x2="380" y2="298" stroke="#444" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <line x1="440" y1="238" x2="590" y2="298" stroke="#444" marker-end="url(#a)"/>

  <line x1="560" y1="414" x2="590" y2="414" stroke="#444"/>
  <text x="596" y="418" font-size="11" fill="#555">depends today</text>
  <line x1="670" y1="414" x2="700" y2="414" stroke="#444" stroke-dasharray="5,4"/>
  <text x="704" y="418" font-size="11" fill="#555">proposed</text>
</svg>
