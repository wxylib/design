[package]
name = "crsreq"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proj4rs01 = { package = "proj4rs", version = "=0.1.10", default-features = false, features = ["crs-definitions", "aeqd"], optional = true }
proj4rs03 = { package = "proj4rs", version = "=0.3.0", default-features = false, features = ["crs-definitions", "aeqd"], optional = true }
terrio-crs = { version = "0.1.0", optional = true }

[features]
p01 = ["dep:proj4rs01"]
p03 = ["dep:proj4rs03"]
tc = ["dep:terrio-crs"]
tc-fb = ["tc", "terrio-crs/wbprojection-fallback"]
